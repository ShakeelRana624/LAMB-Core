[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lamb"
version = "1.0.0"
description = "LAMB - Lifelong Adaptive Memory Buffer"
authors = [
    {name = "LAMB Team"}
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "sentence-transformers>=2.2.0",
    "chromadb>=0.4.0",
    "anthropic>=0.5.0",
    "numpy>=1.24.0",
    "redis>=4.5.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-benchmark>=4.0.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
]

[tool.setuptools]
packages = ["lamb", "attention"]

[tool.setuptools.package-dir]
lamb = "."
attention = "attention"
